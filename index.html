<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>互動抽卡包模擬器 - Card Pack Simulator</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      /* 卡片尺寸維持 450px x 650px */
      --card-width: min(450px, 92vw);
      --card-height: min(650px, 84vh);
      /* 卡包尺寸保持舒適比例 */
      --pack-width: min(340px, 72vw);
      --pack-height: min(720px, 86vh);
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #010306;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    .night-sky-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: 
        radial-gradient(ellipse 65% 55% at 50% 46%, rgba(56, 189, 248, 0.28) 0%, rgba(14, 116, 195, 0.18) 32%, rgba(3, 15, 38, 0.88) 65%, #010308 100%),
        radial-gradient(circle at 22% 28%, rgba(99, 102, 241, 0.14) 0%, transparent 48%),
        radial-gradient(circle at 78% 72%, rgba(6, 182, 212, 0.14) 0%, transparent 50%),
        linear-gradient(180deg, #010207 0%, #030a1c 50%, #010205 100%);
    }

    @keyframes nebulaBreathe {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); opacity: 0.72; }
      50% { transform: translate3d(0, -12px, 0) scale(1.06); opacity: 0.95; }
    }
    .night-sky-aurora {
      position: fixed;
      inset: -10%;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(ellipse 42% 35% at 50% 48%, rgba(125, 211, 252, 0.22) 0%, transparent 70%),
        conic-gradient(from 210deg at 50% 50%, transparent 0deg, rgba(56, 189, 248, 0.08) 65deg, transparent 140deg, rgba(129, 140, 248, 0.07) 220deg, transparent 360deg);
      filter: blur(28px);
      animation: nebulaBreathe 9s ease-in-out infinite;
    }

    .night-sky-grid {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 0.28;
      background-image: 
        linear-gradient(to right, rgba(56, 189, 248, 0.09) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(56, 189, 248, 0.09) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(circle at 50% 48%, black 18%, transparent 74%);
      -webkit-mask-image: radial-gradient(circle at 50% 48%, black 18%, transparent 74%);
    }

    #bg-canvas {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    .top-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
    }

    .brand-pill, .nav-actions {
      pointer-events: auto;
    }

    .brand-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 9999px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.3);
      backdrop-filter: blur(10px);
      font-size: 13px;
      font-weight: 700;
      color: #e0f2fe;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .brand-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 10px #38bdf8;
    }

    .nav-actions {
      display: flex;
      gap: 10px;
    }

    .glass-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 11px 20px;
      border-radius: 9999px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(125, 211, 252, 0.35);
      color: #e0f2fe;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      transition: all 0.2s ease;
    }

    .glass-btn:hover {
      background: rgba(14, 165, 233, 0.3);
      border-color: rgba(125, 211, 252, 0.8);
      transform: translateY(-1px);
    }

    .arena-view {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .camera-rig {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      will-change: transform;
      transform: translate3d(0, 0, 0) scale(1);
      transform-origin: 50% 32%;
    }

    @keyframes cameraZoomBurst {
      0% { transform: translate3d(0, 0, 0) scale(1); }
      38% { transform: translate3d(0, 105px, 0) scale(1.38); }
      72% { transform: translate3d(0, 85px, 0) scale(1.28); }
      100% { transform: translate3d(0, 0, 0) scale(1); }
    }
    .camera-zoom-active {
      animation: cameraZoomBurst 2.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .booster-pack {
      position: relative;
      z-index: 20;
      width: var(--pack-width);
      height: var(--pack-height);
      border-radius: 16px;
      touch-action: none;
      will-change: transform, opacity;
    }

    .pack-full-body {
      position: absolute;
      inset: 0;
      z-index: 24;
      border-radius: 16px;
      overflow: hidden;
      border: 3px solid #7dd3fc;
      background: #0f172a;
      clip-path: inset(15% 0 0 0);
      -webkit-clip-path: inset(15% 0 0 0);
    }

    .pack-cover-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
    }

    .pack-top-flap {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 15%;
      z-index: 40;
      border-radius: 16px 16px 0 0;
      border-top: 3px solid #7dd3fc;
      border-left: 3px solid #7dd3fc;
      border-right: 3px solid #7dd3fc;
      overflow: hidden;
      transform-origin: right bottom;
      will-change: transform, opacity;
      pointer-events: none;
    }
    .pack-top-flap img {
      position: absolute;
      top: -3px; left: -3px;
      width: var(--pack-width);
      height: var(--pack-height);
      object-fit: fill;
      pointer-events: none;
    }

    .pack-rising-card {
      position: absolute;
      top: 16%;
      left: 50%;
      width: var(--card-width);
      height: var(--card-height);
      transform: translate3d(-50%, 15px, 0) scale(0.48);
      z-index: 18;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid rgba(56, 189, 248, 0.6);
      box-shadow: 0 0 35px rgba(125, 211, 252, 0.85);
      opacity: 0;
      pointer-events: none;
      will-change: transform, opacity;
    }
    .pack-rising-card img {
      width: 100%; height: 100%; object-fit: cover;
    }

    @keyframes cardEmergeFromPack {
      0% {
        opacity: 0.25;
        transform: translate3d(-50%, 20px, 0) scale(0.48);
      }
      45% {
        opacity: 1;
        transform: translate3d(-50%, -62px, 0) scale(0.56);
      }
      100% {
        opacity: 1;
        transform: translate3d(-50%, -88px, 0) scale(0.62);
      }
    }
    .card-emerging-anim {
      animation: cardEmergeFromPack 1.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes topFlapTearOff {
      0% {
        transform: translate3d(0, 0, 0) rotate(0deg);
        opacity: 1;
      }
      35% {
        transform: translate3d(20px, -20px, 0) rotate(8deg);
        opacity: 1;
      }
      100% {
        transform: translate3d(250px, -210px, 0) rotate(42deg) scale(0.78);
        opacity: 0;
      }
    }
    .flap-fly-anim {
      animation: topFlapTearOff 1.05s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes packSlideDownOut {
      0% { transform: translate3d(0, 0, 0); opacity: 1; }
      35% { transform: translate3d(0, 30px, 0); opacity: 1; }
      100% { transform: translate3d(0, 560px, 0) scale(0.9); opacity: 0; }
    }
    .pack-exit-down-anim {
      animation: packSlideDownOut 1.55s cubic-bezier(0.32, 0, 0.2, 1) forwards;
    }

    .pack-foil-top {
      position: absolute;
      top: calc(15% - 20px); left: -8px; right: -8px; height: 42px;
      background: transparent;
      display: flex;
      align-items: center;
      z-index: 45;
      cursor: grab;
      user-select: none;
      touch-action: none;
      will-change: transform, opacity;
      transform: translate3d(0, 0, 0);
      transition: opacity 0.15s ease;
    }
    .pack-foil-top:active { cursor: grabbing; }

    .tear-dashed-line {
      position: relative;
      width: 100%;
      height: 0;
      border-top: 2px dashed rgba(255, 255, 255, 0.95);
      filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.95)) drop-shadow(0 0 2px rgba(255, 255, 255, 0.9));
      transition: opacity 0.12s ease;
    }
    .tear-glow-progress {
      position: absolute;
      top: -3px; left: 0;
      height: 4px; width: 0%;
      border-radius: 9999px;
      background: linear-gradient(90deg, #38bdf8, #e0f2fe, #ffffff);
      box-shadow: 0 0 16px #7dd3fc, 0 0 28px #ffffff;
    }

    #fx-canvas {
      position: fixed;
      inset: 0;
      z-index: 950;
      pointer-events: none;
      will-change: contents;
    }

    #cardStage {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    @keyframes revealCardPop {
      0% { transform: scale(0.62); opacity: 0.85; }
      100% { transform: scale(1); opacity: 1; }
    }
    .card-reveal-enter {
      animation: revealCardPop 0.38s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .card-container {
      width: var(--card-width);
      height: var(--card-height);
      position: relative;
      perspective: 1200px;
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
      cursor: pointer;
      transition: transform 0.78s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .card-container.flipped {
      transform: rotateY(180deg);
      -webkit-transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 16px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 2px solid rgba(56, 189, 248, 0.4);
      overflow: hidden;
    }

    .card-back {
      z-index: 2;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      transform: rotateY(0deg);
    }

    .card-front {
      z-index: 1;
      background: #1e293b;
      transform: rotateY(180deg);
    }

    .card-front img, .card-back img {
      width: 100%; height: 100%; object-fit: cover;
      pointer-events: none;
    }

    .card-action-bar {
      display: flex;
      gap: 15px;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s ease;
      pointer-events: none;
    }
    .card-action-bar.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    .card-action-bar .glass-btn {
      padding: 13px 24px;
      font-size: 15px;
      font-weight: 800;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 12, 0.85);
      backdrop-filter: blur(10px);
      z-index: 2000;
      display: none;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      overflow-y: auto;
    }
    .modal-content {
      width: 100%; max-width: 900px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 20px;
      padding: 30px;
    }
    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 25px;
      border-bottom: 1px solid rgba(56, 189, 248, 0.2);
      padding-bottom: 15px;
    }
    .binder-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 15px;
    }
    .binder-item {
      background: #02060c;
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 10px;
      aspect-ratio: 7/10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .binder-item.owned {
      border-color: #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
    }
    .binder-item img { width: 100%; height: 100%; object-fit: cover; }
    .binder-locked { color: #64748b; font-size: 14px; font-weight: bold; }
    .count-badge {
      position: absolute; top: 6px; right: 6px;
      background: #0284c7; color: #fff;
      font-size: 11px; padding: 2px 6px; border-radius: 6px;
    }

    .toast-msg {
      position: fixed;
      top: 75px;
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      z-index: 3000;
      padding: 10px 20px;
      border-radius: 9999px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(56, 189, 248, 0.6);
      color: #e0f2fe;
      font-size: 13px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
    }
    .toast-msg.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <div class="night-sky-bg"></div>
  <div class="night-sky-aurora"></div>
  <div class="night-sky-grid"></div>
  <canvas id="bg-canvas"></canvas>
  <canvas id="fx-canvas"></canvas>

  <div class="toast-msg" id="toastMsg"></div>

  <div class="top-header">
    <div class="brand-pill">
      <span class="brand-dot"></span>
      <span>STARLIGHT TCG</span>
    </div>
    <div class="nav-actions">
      <button class="glass-btn" onclick="openModal('binderModal')">📖 收藏冊 (<span id="collectedCount">0</span>/<span id="maxCardsTotal">30</span>)</button>
      <button class="glass-btn" onclick="openModal('settingsModal')">🖼️ 自訂媒體</button>
    </div>
  </div>

  <div class="arena-view" id="packStage">
    <div class="camera-rig" id="cameraRig">
      <div class="booster-pack" id="boosterPack">
        <div class="pack-rising-card" id="packRisingCard">
          <img id="risingCardBackImg" src="card_back.jpeg" alt="抽出的卡背" onerror="this.src='https://via.placeholder.com/450x650/1e293b/38bdf8?text=Card+Back'">
        </div>

        <div class="pack-full-body" id="packFullBody">
          <!-- 支援 .jpg / .jpeg，如果你的封面是 pack_cover.png 請自行更換檔名 -->
          <img class="pack-cover-img" id="packCoverImg" src="pack_cover.png" alt="卡包封面" onerror="this.src='https://via.placeholder.com/340x720/0f172a/7dd3fc?text=Booster+Pack'">
        </div>

        <div class="pack-top-flap" id="packTopFlap">
          <img id="packCoverImgTopFlap" src="pack_cover.png" alt="卡包頂部" onerror="this.src='https://via.placeholder.com/340x720/0f172a/7dd3fc?text=Booster+Pack'">
        </div>

        <div class="pack-foil-top" id="packFoil">
          <div class="tear-dashed-line">
            <div class="tear-glow-progress" id="tearGlowProgress"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="cardStage">
    <div class="card-container" id="cardContainer" onclick="flipCardToFront()">
      <div class="card-face card-back">
        <img id="cardBackImg" src="card_back.jpeg" alt="卡背" onerror="this.src='https://via.placeholder.com/450x650/1e293b/38bdf8?text=Card+Back'">
      </div>
      <div class="card-face card-front">
        <img id="pulledCardImg" src="" alt="抽出的卡片" onerror="this.src='https://via.placeholder.com/450x650/1e293b/ffffff?text=Card+Image+Not+Found'">
      </div>
    </div>
    <div class="card-action-bar" id="cardActionBar">
      <button class="glass-btn" onclick="returnToPack()">✨ 收起卡片並繼續抽卡</button>
      <button class="glass-btn" onclick="openModal('binderModal')">📖 查看收藏冊</button>
    </div>
  </div>

  <div class="modal" id="binderModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>卡牌收藏冊</h2>
        <button class="glass-btn" onclick="closeModal('binderModal')">關閉</button>
      </div>
      <div class="binder-grid" id="binderGrid"></div>
    </div>
  </div>

  <div class="modal" id="settingsModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>自訂圖片素材</h2>
        <button class="glass-btn" onclick="closeModal('settingsModal')">關閉與儲存</button>
      </div>
      <div style="display: flex; flex-direction: column; gap: 15px;">
        <label>卡包封面圖片: <input type="file" id="coverFileInput" accept="image/*" onchange="updateCustomCover(event)"></label>
        <label>卡背圖片: <input type="file" id="backFileInput" accept="image/*" onchange="updateCustomBack(event)"></label>
        <label>批量上傳卡片圖 (支援多張): <input type="file" id="cardsFileInput" accept="image/*" multiple onchange="updateCustomCards(event)"></label>
      </div>
    </div>
  </div>

  <script>
    function showToast(msg) {
      const toast = document.getElementById('toastMsg');
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    const fxCanvas = document.getElementById('fx-canvas');
    const fxCtx = fxCanvas.getContext('2d');

    let particles = [];
    let fxParticles = [];
    let energyRibbons = [];
    let shockwaves = [];
    let lightRays = [];
    let orbitingMeteors = [];
    let coreGlow = null;

    function resizeCanvases() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      fxCanvas.width = window.innerWidth;
      fxCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvases);
    resizeCanvases();

    for (let i = 0; i < 65; i++) {
      const isBokeh = i < 16;
      particles.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        radius: isBokeh ? (Math.random() * 14 + 8) : (Math.random() * 2.6 + 0.9),
        speedY: isBokeh ? -(Math.random() * 0.18 + 0.06) : -(Math.random() * 0.32 + 0.12),
        speedX: (Math.random() - 0.5) * 0.25,
        alpha: isBokeh ? (Math.random() * 0.12 + 0.04) : (Math.random() * 0.65 + 0.2),
        twinkleSpeed: Math.random() * 0.03 + 0.01,
        twinklePhase: Math.random() * Math.PI * 2,
        isBokeh: isBokeh,
        color: Math.random() < 0.78 ? '#7dd3fc' : '#bae6fd'
      });
    }
    function drawBg() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      ctx.clearRect(0, 0, w, h);

      const cx = w * 0.5;
      const cy = h * 0.48;
      const stageHalo = ctx.createRadialGradient(cx, cy, 20, cx, cy, Math.min(w, h) * 0.44);
      stageHalo.addColorStop(0, 'rgba(56, 189, 248, 0.14)');
      stageHalo.addColorStop(0.55, 'rgba(14, 165, 233, 0.05)');
      stageHalo.addColorStop(1, 'rgba(1, 3, 8, 0)');
      ctx.fillStyle = stageHalo;
      ctx.fillRect(0, 0, w, h);

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        p.twinklePhase += p.twinkleSpeed;
        const currentAlpha = Math.max(0.02, p.alpha * (0.75 + 0.25 * Math.sin(p.twinklePhase)));

        ctx.globalAlpha = currentAlpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();

        if (!p.isBokeh && p.radius > 2.3) {
          ctx.globalAlpha = currentAlpha * 0.55;
          ctx.fillRect(p.x - p.radius * 2.4, p.y - 0.5, p.radius * 4.8, 1);
          ctx.fillRect(p.x - 0.5, p.y - p.radius * 2.4, 1, p.radius * 4.8);
        }

        p.y += p.speedY; p.x += p.speedX;
        if (p.y < -20) p.y = h + 20;
        if (p.y > h + 20) p.y = -20;
        if (p.x < -20) p.x = w + 20;
        if (p.x > w + 20) p.x = -20;
      }
      requestAnimationFrame(drawBg);
    }
    drawBg();

    const sparkPalette = [
      { core: '#ffffff', glow: 'rgba(186, 230, 253, 0.75)' },
      { core: '#e0f2fe', glow: 'rgba(56, 189, 248, 0.7)' },
      { core: '#7dd3fc', glow: 'rgba(14, 165, 233, 0.65)' },
      { core: '#fef08a', glow: 'rgba(253, 224, 71, 0.75)' },
      { core: '#c084fc', glow: 'rgba(192, 132, 252, 0.65)' }
    ];

    function startCardOrbitMeteors(getCenterFn, rx, ry) {
      orbitingMeteors = [];
      const meteorConfigs = [
        { angle: 0, speed: 0.088, tilt: -0.38, core: '#ffffff', glow: 'rgba(125, 211, 252, 0.92)', size: 6.2, rScale: 1.0, maxAngle: Math.PI * 3.4 },
        { angle: Math.PI, speed: 0.088, tilt: -0.38, core: '#fef08a', glow: 'rgba(253, 224, 71, 0.92)', size: 5.8, rScale: 1.0, maxAngle: Math.PI * 3.4 },
        { angle: Math.PI * 0.45, speed: -0.082, tilt: 0.34, core: '#e0f2fe', glow: 'rgba(56, 189, 248, 0.9)', size: 5.2, rScale: 1.08, maxAngle: Math.PI * 3.0 },
        { angle: Math.PI * 1.45, speed: -0.082, tilt: 0.34, core: '#f3e8ff', glow: 'rgba(192, 132, 252, 0.88)', size: 5.0, rScale: 1.08, maxAngle: Math.PI * 3.0 }
      ];

      meteorConfigs.forEach((cfg) => {
        orbitingMeteors.push({
          getCenter: getCenterFn,
          rx: rx * cfg.rScale,
          ry: ry * cfg.rScale,
          angle: cfg.angle,
          traveledAngle: 0,
          maxAngle: cfg.maxAngle,
          speed: cfg.speed,
          tilt: cfg.tilt,
          core: cfg.core,
          glow: cfg.glow,
          size: cfg.size,
          alpha: 0,
          fadingOut: false,
          trail: []
        });
      });
    }

    function stopCardOrbitMeteors() {
      orbitingMeteors.forEach(m => { m.fadingOut = true; });
    }

    function spawnEnergyRibbon(x, y, side = 0, scale = 1) {
      if (energyRibbons.length > 16) energyRibbons.shift();
      const dir = side !== 0 ? side : (Math.random() > 0.5 ? 1 : -1);
      const speedY = -(Math.random() * 7.5 + 8.5) * scale;
      const speedX = dir * (Math.random() * 2.2 + 1.0) * scale;
      energyRibbons.push({
        x: x + (Math.random() - 0.5) * 18,
        y: y,
        vx: speedX,
        vy: speedY,
        curveForce: dir * (Math.random() * 0.32 + 0.18) * scale,
        waveFreq: Math.random() * 0.1 + 0.05,
        wavePhase: Math.random() * Math.PI * 2,
        width: (Math.random() * 5.2 + 4.2) * scale,
        alpha: 1,
        decay: 0.012,
        maxPoints: 24,
        points: [{ x, y }]
      });
    }

    function spawnTearSparks(x, y, intensity = 1) {
      coreGlow = { x, y, radius: 130 * intensity, alpha: Math.min(1, 0.85 * intensity) };
      const count = Math.floor(16 * intensity);
      for (let i = 0; i < count; i++) {
        if (fxParticles.length > 300) break;
        const angle = -Math.PI / 2 + (Math.random() - 0.5) * 2.1;
        const speed = (Math.random() * 12 + 8) * intensity;
        const colorObj = sparkPalette[Math.floor(Math.random() * sparkPalette.length)];
        fxParticles.push({
          x: x + (Math.random() - 0.5) * 22,
          y: y + (Math.random() - 0.5) * 10,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          length: (Math.random() * 22 + 13) * intensity,
          width: (Math.random() * 2.8 + 1.9),
          color: colorObj.core,
          glow: colorObj.glow,
          alpha: 1,
          decay: Math.random() * 0.024 + 0.018,
          gravity: 0.05,
          drag: 0.986
        });
      }
      if (Math.random() < 0.45 * intensity) {
        spawnEnergyRibbon(x, y, 0, 0.95 * intensity);
      }
    }

    function spawnBlueFireworks(cx, cy) {
      coreGlow = { x: cx, y: cy, radius: 420, alpha: 1 };

      shockwaves.push({ x: cx, y: cy, radius: 20, maxRadius: 580, alpha: 1, lineWidth: 9 });
      shockwaves.push({ x: cx, y: cy, radius: 12, maxRadius: 400, alpha: 0.92, lineWidth: 6 });

      for (let i = 0; i < 18; i++) {
        const angle = -Math.PI + (Math.PI * i) / 17 + (Math.random() - 0.5) * 0.12;
        lightRays.push({
          x: cx,
          y: cy,
          angle: angle,
          length: Math.random() * 380 + 280,
          width: Math.random() * 24 + 11,
          alpha: Math.random() * 0.5 + 0.45,
          decay: 0.015
        });
      }

      const sides = [-1, -1, -1, -1, 1, 1, 1, 1];
      const scales = [1.4, 1.25, 1.15, 1.3, 1.4, 1.25, 1.15, 1.3];
      for (let i = 0; i < sides.length; i++) {
        spawnEnergyRibbon(cx + (Math.random() - 0.5) * 30, cy, sides[i], scales[i]);
      }

      for (let i = 0; i < 160; i++) {
        const isUpwardBurst = i < 115;
        const angle = isUpwardBurst
          ? -Math.PI / 2 + (Math.random() - 0.5) * 2.6
          : Math.random() * Math.PI * 2;
        const speed = Math.random() * 12 + 6;
        const colorObj = sparkPalette[Math.floor(Math.random() * sparkPalette.length)];
        fxParticles.push({
          x: cx + (Math.random() - 0.5) * 40,
          y: cy + (Math.random() - 0.5) * 18,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          length: Math.random() * 30 + 16,
          width: Math.random() * 3.8 + 2.2,
          color: colorObj.core,
          glow: colorObj.glow,
          alpha: 1,
          decay: Math.random() * 0.012 + 0.008,
          gravity: 0.045,
          drag: 0.986
        });
      }
    }

    let lastFxTime = performance.now();
    function drawFx(now) {
      const dt = Math.min((now - lastFxTime) / 16.667, 2.2);
      lastFxTime = now;

      const w = window.innerWidth;
      const h = window.innerHeight;
      fxCtx.clearRect(0, 0, w, h);

      if (
        (!coreGlow || coreGlow.alpha <= 0.01) &&
        fxParticles.length === 0 &&
        energyRibbons.length === 0 &&
        shockwaves.length === 0 &&
        lightRays.length === 0 &&
        orbitingMeteors.length === 0
      ) {
        requestAnimationFrame(drawFx);
        return;
      }

      for (let i = orbitingMeteors.length - 1; i >= 0; i--) {
        const m = orbitingMeteors[i];
        if (m.fadingOut) {
          m.alpha -= 0.045 * dt;
          if (m.alpha <= 0) {
            orbitingMeteors.splice(i, 1);
            continue;
          }
        } else if (m.alpha < 1) {
          m.alpha = Math.min(1, m.alpha + 0.06 * dt);
        }

        const stepAngle = m.speed * dt;
        m.angle += stepAngle;
        m.traveledAngle += Math.abs(stepAngle);
        if (!m.fadingOut && m.traveledAngle >= m.maxAngle) {
          m.fadingOut = true;
        }

        const center = m.getCenter();
        const rawX = Math.cos(m.angle) * m.rx;
        const rawY = Math.sin(m.angle) * m.ry;
        const rotX = rawX * Math.cos(m.tilt) - rawY * Math.sin(m.tilt);
        const rotY = rawX * Math.sin(m.tilt) + rawY * Math.cos(m.tilt);
        const px = center.x + rotX;
        const py = center.y + rotY;

        m.trail.push({ x: px, y: py });
        if (m.trail.length > 32) m.trail.shift();

        if (m.trail.length > 2) {
          for (let j = 1; j < m.trail.length; j++) {
            const ratio = j / m.trail.length;
            fxCtx.beginPath();
            fxCtx.moveTo(m.trail[j - 1].x, m.trail[j - 1].y);
            fxCtx.lineTo(m.trail[j].x, m.trail[j].y);
            fxCtx.strokeStyle = m.glow;
            fxCtx.globalAlpha = m.alpha * ratio * 0.78;
            fxCtx.lineWidth = m.size * 3.4 * ratio;
            fxCtx.lineCap = 'round';
            fxCtx.stroke();

            fxCtx.beginPath();
            fxCtx.moveTo(m.trail[j - 1].x, m.trail[j - 1].y);
            fxCtx.lineTo(m.trail[j].x, m.trail[j].y);
            fxCtx.strokeStyle = m.core;
            fxCtx.globalAlpha = m.alpha * ratio;
            fxCtx.lineWidth = m.size * 1.45 * ratio;
            fxCtx.stroke();
          }
        }

        fxCtx.globalAlpha = m.alpha;
        const headGrad = fxCtx.createRadialGradient(px, py, 0, px, py, m.size * 5.2);
        headGrad.addColorStop(0, m.core);
        headGrad.addColorStop(0.45, m.glow);
        headGrad.addColorStop(1, 'rgba(14, 165, 233, 0)');
        fxCtx.fillStyle = headGrad;
        fxCtx.beginPath();
        fxCtx.arc(px, py, m.size * 5.2, 0, Math.PI * 2);
        fxCtx.fill();

        fxCtx.fillStyle = '#ffffff';
        fxCtx.fillRect(px - m.size * 3.6, py - 1.1, m.size * 7.2, 2.2);
        fxCtx.fillRect(px - 1.1, py - m.size * 3.6, 2.2, m.size * 7.2);

        if (!m.fadingOut && Math.random() < 0.45 * dt && fxParticles.length < 320) {
          fxParticles.push({
            x: px + (Math.random() - 0.5) * 10,
            y: py + (Math.random() - 0.5) * 10,
            vx: (Math.random() - 0.5) * 1.8,
            vy: (Math.random() - 0.5) * 1.8 + 0.3,
            length: Math.random() * 8 + 4,
            width: Math.random() * 2.4 + 1.4,
            color: m.core,
            glow: m.glow,
            alpha: 0.95,
            decay: 0.032,
            gravity: 0.02,
            drag: 0.96
          });
        }
      }

      fxCtx.globalAlpha = 1;
      for (let i = lightRays.length - 1; i >= 0; i--) {
        const ray = lightRays[i];
        fxCtx.save();
        fxCtx.translate(ray.x, ray.y);
        fxCtx.rotate(ray.angle);
        const rayGrad = fxCtx.createLinearGradient(0, 0, ray.length, 0);
        rayGrad.addColorStop(0, `rgba(255, 255, 255, ${ray.alpha})`);
        rayGrad.addColorStop(0.35, `rgba(125, 211, 252, ${ray.alpha * 0.75})`);
        rayGrad.addColorStop(1, 'rgba(14, 165, 233, 0)');
        fxCtx.fillStyle = rayGrad;
        fxCtx.beginPath();
        fxCtx.moveTo(0, -ray.width * 0.2);
        fxCtx.lineTo(ray.length, -ray.width);
        fxCtx.lineTo(ray.length, ray.width);
        fxCtx.lineTo(0, ray.width * 0.2);
        fxCtx.closePath();
        fxCtx.fill();
        fxCtx.restore();

        ray.length *= Math.pow(1.025, dt);
        ray.alpha -= ray.decay * dt;
        if (ray.alpha <= 0) lightRays.splice(i, 1);
      }

      if (coreGlow && coreGlow.alpha > 0.01) {
        const grad = fxCtx.createRadialGradient(coreGlow.x, coreGlow.y, 0, coreGlow.x, coreGlow.y, coreGlow.radius);
        grad.addColorStop(0, `rgba(255, 255, 255, ${coreGlow.alpha})`);
        grad.addColorStop(0.32, `rgba(186, 230, 253, ${coreGlow.alpha * 0.92})`);
        grad.addColorStop(0.68, `rgba(14, 165, 233, ${coreGlow.alpha * 0.45})`);
        grad.addColorStop(1, 'rgba(14, 165, 233, 0)');
        fxCtx.fillStyle = grad;
        fxCtx.beginPath();
        fxCtx.arc(coreGlow.x, coreGlow.y, coreGlow.radius, 0, Math.PI * 2);
        fxCtx.fill();

        coreGlow.alpha *= Math.pow(0.91, dt);
        coreGlow.radius *= Math.pow(1.02, dt);
      }

      fxCtx.lineCap = 'round';
      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const sw = shockwaves[i];
        fxCtx.beginPath();
        fxCtx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
        fxCtx.strokeStyle = `rgba(56, 189, 248, ${sw.alpha * 0.45})`;
        fxCtx.lineWidth = sw.lineWidth * 2.6;
        fxCtx.stroke();

        fxCtx.beginPath();
        fxCtx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
        fxCtx.strokeStyle = `rgba(224, 242, 254, ${sw.alpha})`;
        fxCtx.lineWidth = sw.lineWidth;
        fxCtx.stroke();

        sw.radius += (sw.maxRadius - sw.radius) * (1 - Math.pow(0.88, dt));
        sw.alpha -= 0.022 * dt;
        sw.lineWidth *= Math.pow(0.96, dt);
        if (sw.alpha <= 0) shockwaves.splice(i, 1);
      }

      fxCtx.lineJoin = 'round';
      for (let i = energyRibbons.length - 1; i >= 0; i--) {
        const r = energyRibbons[i];
        r.wavePhase += r.waveFreq * dt;
        r.vx += (r.curveForce + Math.sin(r.wavePhase) * 0.35) * dt;
        r.vy *= Math.pow(0.985, dt);
        r.x += r.vx * dt;
        r.y += r.vy * dt;
        r.points.push({ x: r.x, y: r.y });
        if (r.points.length > r.maxPoints) r.points.shift();
        r.alpha -= r.decay * dt;

        if (r.alpha <= 0) {
          energyRibbons.splice(i, 1);
          continue;
        }

        if (r.points.length > 2) {
          fxCtx.beginPath();
          fxCtx.moveTo(r.points[0].x, r.points[0].y);
          for (let j = 1; j < r.points.length - 1; j++) {
            const xc = (r.points[j].x + r.points[j + 1].x) / 2;
            const yc = (r.points[j].y + r.points[j + 1].y) / 2;
            fxCtx.quadraticCurveTo(r.points[j].x, r.points[j].y, xc, yc);
          }

          fxCtx.strokeStyle = `rgba(125, 211, 252, ${r.alpha * 0.5})`;
          fxCtx.lineWidth = r.width * 3.2;
          fxCtx.stroke();

          fxCtx.strokeStyle = `rgba(255, 255, 255, ${r.alpha})`;
          fxCtx.lineWidth = r.width * 1.0;
          fxCtx.stroke();
        }
      }

      for (let i = fxParticles.length - 1; i >= 0; i--) {
        const p = fxParticles[i];
        const dragPow = Math.pow(p.drag, dt);
        p.vx *= dragPow;
        p.vy = p.vy * dragPow + p.gravity * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.alpha -= p.decay * dt;

        if (p.alpha <= 0) {
          fxParticles.splice(i, 1);
          continue;
        }

        const speed = Math.hypot(p.vx, p.vy) || 1;
        const streakLen = Math.min(p.length * 1.65, speed * 1.9);
        const tailX = p.x - (p.vx / speed) * streakLen;
        const tailY = p.y - (p.vy / speed) * streakLen;

        fxCtx.globalAlpha = Math.max(0, p.alpha);

        fxCtx.beginPath();
        fxCtx.moveTo(tailX, tailY);
        fxCtx.lineTo(p.x, p.y);
        fxCtx.strokeStyle = p.glow;
        fxCtx.lineWidth = p.width * 2.2;
        fxCtx.stroke();

        fxCtx.beginPath();
        fxCtx.moveTo(tailX, tailY);
        fxCtx.lineTo(p.x, p.y);
        fxCtx.strokeStyle = p.color;
        fxCtx.lineWidth = p.width;
        fxCtx.stroke();
      }

      fxCtx.restore();
      requestAnimationFrame(drawFx);
    }
    requestAnimationFrame(drawFx);

    /* 完整恢復 30 張卡片資料庫 */
    let cardDatabase = JSON.parse(localStorage.getItem('tcg_cards')) || [
      { id: 1, name: "Q龍", img: "Q龍.png" },
      { id: 2, name: "信號獵豹", img: "信號獵豹.png" },
      { id: 3, name: "光狐", img: "光狐.png" },
      { id: 4, name: "北極狼", img: "北極狼.png" },
      { id: 5, name: "北環支蝶", img: "北環支蝶.png" },

      { id: 7, name: "吊鉤蟹", img: "吊鉤蟹.png" },
      { id: 8, name: "土建龜", img: "土建龜.png" },
      { id: 9, name: "屯南水獺", img: "屯南水獺.png" },
      { id: 10, name: "扶梯鹿", img: "扶梯鹿.png" },
      { id: 11, name: "智慧龍", img: "智慧龍.png" },
      { id: 12, name: "月台守護者", img: "月台守護者.png" },
      { id: 13, name: "東涌延綫蛇", img: "東涌延綫蛇.png" },
      { id: 14, name: "洪天牛", img: "洪天牛.png" },
      { id: 15, name: "活泉魚", img: "活泉魚.png" },
      { id: 16, name: "清潔鴨", img: "清潔鴨.png" },
      { id: 17, name: "接電鼠", img: "接電鼠.png" },
      { id: 18, name: "救火雄獅", img: "救火雄獅.png" },
      { id: 19, name: "新田環保鳥", img: "新田環保鳥.png" },
      { id: 20, name: "智慧海豚", img: "智慧海豚.png" },
      { id: 21, name: "熔焊蜥", img: "熔焊蜥.png" },
      { id: 22, name: "築巢企鵝", img: "築巢企鵝.png" },
      { id: 23, name: "網絡章魚", img: "網絡章魚.png" },
      { id: 24, name: "蠔灣貝", img: "蠔灣貝.png" },
      { id: 25, name: "變壓貓", img: "變壓貓.png" },
      { id: 26, name: "鋼鐵犀牛", img: "鋼鐵犀牛.png" },
      { id: 27, name: "錦上河狸", img: "錦上河狸.png" },
      { id: 28, name: "雲梯長頸鹿", img: "雲梯長頸鹿.png" },
      { id: 29, name: "靜音貓", img: "靜音貓.png" },
      { id: 30, name: "飛天眼", img: "飛天眼.png" }
    ];

    let packCover = localStorage.getItem('tcg_cover') || 'pack_cover.png';
    let cardBack = localStorage.getItem('tcg_back') || 'card_back.jpeg';
    let collection = JSON.parse(localStorage.getItem('tcg_collection')) || {};

    document.getElementById('packCoverImg').src = packCover;
    document.getElementById('packCoverImgTopFlap').src = packCover;
    document.getElementById('cardBackImg').src = cardBack;
    document.getElementById('risingCardBackImg').src = cardBack;

    updateHeaderInfo();

    function updateHeaderInfo() {
      const ownedTotal = Object.keys(collection).filter(k => collection[k] > 0).length;
      document.getElementById('collectedCount').innerText = ownedTotal;
      document.getElementById('maxCardsTotal').innerText = cardDatabase.length;
    }

    const foil = document.getElementById('packFoil');
    const tearGlowProgress = document.getElementById('tearGlowProgress');
    const boosterPack = document.getElementById('boosterPack');
    const packTopFlap = document.getElementById('packTopFlap');
    const packFullBody = document.getElementById('packFullBody');
    const packRisingCard = document.getElementById('packRisingCard');
    const cameraRig = document.getElementById('cameraRig');

    let isDragging = false;
    let isOpening = false;
    let startX = 0;
    let dragProgress = 0;
    const maxDrag = 220;

    function startDrag(e) {
      if (isOpening) return;
      isDragging = true;
      startX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
      const rect = foil.getBoundingClientRect();
      spawnTearSparks(rect.left + 16, rect.top + 20, 1.3);
    }
    function onDrag(e) {
      if (!isDragging || isOpening) return;
      let currentX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
      let delta = currentX - startX;
      dragProgress = Math.max(0, Math.min(maxDrag, delta));
      const ratio = dragProgress / maxDrag;

      tearGlowProgress.style.width = `${ratio * 100}%`;
      packTopFlap.style.transform = `translate3d(${ratio * 22}px, ${-ratio * 10}px, 0) rotate(${ratio * 4.5}deg)`;

      const shakeX = (Math.random() - 0.5) * 4 * ratio;
      const shakeY = (Math.random() - 0.5) * 3 * ratio;
      boosterPack.style.transform = `translate3d(${shakeX}px, ${shakeY}px, 0)`;
      boosterPack.style.filter = `drop-shadow(0 20px 38px rgba(0, 0, 0, 0.85)) drop-shadow(0 0 ${26 + ratio * 42}px rgba(56, 189, 248, ${0.35 + ratio * 0.6}))`;

      const rect = foil.getBoundingClientRect();
      const sparkX = rect.left + Math.min(rect.width, 20 + dragProgress * 1.15);
      const sparkY = rect.top + 20;
      spawnTearSparks(sparkX, sparkY, 0.9 + ratio * 1.2);

      if (dragProgress >= maxDrag) {
        isDragging = false;
        boosterPack.style.transform = 'translate3d(0, 0, 0)';
        triggerOpenSequence();
      }
    }
    function endDrag() {
      if (!isDragging || isOpening) return;
      isDragging = false;
      boosterPack.style.transform = 'translate3d(0, 0, 0)';
      boosterPack.style.filter = '';
      if (dragProgress < maxDrag) {
        dragProgress = 0;
        tearGlowProgress.style.width = '0%';
        packTopFlap.style.transform = 'translate3d(0, 0, 0) rotate(0deg)';
      }
    }

    foil.addEventListener('mousedown', startDrag);
    window.addEventListener('mousemove', onDrag);
    window.addEventListener('mouseup', endDrag);
    foil.addEventListener('touchstart', startDrag, { passive: true });
    window.addEventListener('touchmove', onDrag, { passive: true });
    window.addEventListener('touchend', endDrag);

    let pulledCard = null;

    function triggerOpenSequence() {
      isOpening = true;
      foil.style.pointerEvents = 'none';
      foil.style.display = 'none';

      const randomIndex = Math.floor(Math.random() * cardDatabase.length);
      pulledCard = cardDatabase[randomIndex];
      collection[pulledCard.id] = (collection[pulledCard.id] || 0) + 1;
      localStorage.setItem('tcg_collection', JSON.stringify(collection));
      updateHeaderInfo();

      const frontImg = document.getElementById('pulledCardImg');
      frontImg.src = pulledCard.img;

      if (frontImg.decode) {
        frontImg.decode().catch(() => {});
      }

      packTopFlap.classList.add('flap-fly-anim');
      cameraRig.classList.add('camera-zoom-active');

      const packRect = boosterPack.getBoundingClientRect();
      const centerX = packRect.left + packRect.width / 2;
      const tearY = packRect.top + packRect.height * 0.14;
      spawnBlueFireworks(centerX, tearY);

      setTimeout(() => {
        const zoomedRect = boosterPack.getBoundingClientRect();
        spawnBlueFireworks(
          zoomedRect.left + zoomedRect.width / 2,
          zoomedRect.top + zoomedRect.height * 0.14
        );
        packRisingCard.classList.add('card-emerging-anim');

        startCardOrbitMeteors(() => {
          const r = packRisingCard.getBoundingClientRect();
          return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
        }, 255, 86);
      }, 400);

      setTimeout(() => {
        packFullBody.classList.add('pack-exit-down-anim');
      }, 1100);

      setTimeout(() => {
        document.getElementById('packStage').style.display = 'none';
        cameraRig.classList.remove('camera-zoom-active');
        packTopFlap.classList.remove('flap-fly-anim');
        packRisingCard.classList.remove('card-emerging-anim');
        packFullBody.classList.remove('pack-exit-down-anim');
        boosterPack.style.filter = '';
        isOpening = false;

        showCardReveal();
      }, 2450);
    }

    function showCardReveal() {
      const cardStage = document.getElementById('cardStage');
      const container = document.getElementById('cardContainer');
      const actionBar = document.getElementById('cardActionBar');

      container.classList.remove('flipped');
      container.classList.remove('card-reveal-enter');
      void container.offsetWidth;
      container.classList.add('card-reveal-enter');

      actionBar.classList.remove('show');
      cardStage.style.display = 'flex';

      orbitingMeteors.forEach(m => {
        m.getCenter = () => {
          const r = container.getBoundingClientRect();
          return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
        };
      });
    }

    function flipCardToFront() {
      const container = document.getElementById('cardContainer');
      container.classList.remove('card-reveal-enter');
      if (!container.classList.contains('flipped')) {
        container.classList.add('flipped');
        const r = container.getBoundingClientRect();
        spawnTearSparks(r.left + r.width / 2, r.top + r.height / 2, 1.35);
        stopCardOrbitMeteors();

        setTimeout(() => {
          document.getElementById('cardActionBar').classList.add('show');
        }, 500);
      }
    }

    function returnToPack() {
      stopCardOrbitMeteors();
      document.getElementById('cardStage').style.display = 'none';
      document.getElementById('cardActionBar').classList.remove('show');
      document.getElementById('cardContainer').classList.remove('flipped');
      document.getElementById('cardContainer').classList.remove('card-reveal-enter');
      resetPack();
    }

    function resetPack() {
      dragProgress = 0;
      isOpening = false;
      foil.style.display = 'flex';
      foil.style.pointerEvents = 'auto';
      foil.style.opacity = '1';
      tearGlowProgress.style.width = '0%';
      packTopFlap.style.transform = 'translate3d(0, 0, 0) rotate(0deg)';
      packRisingCard.style.opacity = 0;
      document.getElementById('packStage').style.display = 'flex';
    }

    function openModal(modalId) {
      if (modalId === 'binderModal') renderBinder();
      document.getElementById(modalId).style.display = 'flex';
    }
    function closeModal(modalId) {
      document.getElementById(modalId).style.display = 'none';
    }

    function renderBinder() {
      const grid = document.getElementById('binderGrid');
      grid.innerHTML = '';
      let ownedTotal = 0;

      cardDatabase.forEach(card => {
        const count = collection[card.id] || 0;
        if (count > 0) ownedTotal++;
        const item = document.createElement('div');
        item.className = `binder-item ${count > 0 ? 'owned' : ''}`;
        if (count > 0) {
          item.innerHTML = `<img src="${card.img}" alt="${card.name}" onerror="this.src='https://via.placeholder.com/130x180/02060c/38bdf8?text=Card'"><div class="count-badge">x${count}</div>`;
        } else {
          item.innerHTML = `<span class="binder-locked">#${String(card.id).padStart(3, '0')}</span>`;
        }
        grid.appendChild(item);
      });
      updateHeaderInfo();
    }

    function updateCustomCover(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          packCover = evt.target.result;
          localStorage.setItem('tcg_cover', packCover);
          document.getElementById('packCoverImg').src = packCover;
          document.getElementById('packCoverImgTopFlap').src = packCover;
          showToast('已更新卡包封面！');
        };
        reader.readAsDataURL(file);
      }
    }
    function updateCustomBack(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          cardBack = evt.target.result;
          localStorage.setItem('tcg_back', cardBack);
          document.getElementById('cardBackImg').src = cardBack;
          document.getElementById('risingCardBackImg').src = cardBack;
          showToast('已更新卡背！');
        };
        reader.readAsDataURL(file);
      }
    }
    function updateCustomCards(e) {
      const files = e.target.files;
      if (files.length > 0) {
        let newCards = [];
        let loadedCount = 0;
        const totalFiles = files.length;
        
        for (let i = 0; i < totalFiles; i++) {
          const reader = new FileReader();
          reader.onload = (function(index) {
            return function(evt) {
              newCards.push({
                id: index + 1,
                name: `自訂卡片 #${index + 1}`,
                img: evt.target.result
              });
              loadedCount++;
              if (loadedCount === totalFiles) {
                cardDatabase = newCards;
                localStorage.setItem('tcg_cards', JSON.stringify(cardDatabase));
                updateHeaderInfo();
                showToast(`成功載入 ${loadedCount} 張卡片！`);
              }
            };
          })(i);
          reader.readAsDataURL(files[i]);
        }
      }
    }
  </script>
</body>
</html>
